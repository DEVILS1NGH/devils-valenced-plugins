name: Publish Valenced plugin repository

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.sources/**'
      - 'repo.config.json'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valenced-plugin-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize editable plugin source
        run: python3 scripts/materialize_sources.py

      - name: Commit materialized source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/spotify-tools/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Spotify Tools source"
            git push origin HEAD:main
          fi

      - name: Check out published repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0

      - name: Package plugins and generate index
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/publish_repository.py \
            --source plugins \
            --pool-dir published/pool \
            --out published/index.json \
            --config repo.config.json \
            --repository "$REPOSITORY" \
            --branch gh-pages

      - name: Commit published artifacts
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json pool
          if git diff --cached --quiet; then
            echo "No repository changes to publish."
          else
            git commit -m "Publish Valenced plugin updates"
            git push origin HEAD:gh-pages
          fi
